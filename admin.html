<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel Dulce Maniak</title>

    <link rel="stylesheet" href="admin.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header class="admin-header">
        <h1>🍰 Dulce Maniak</h1>
        <p>Panel de administración</p>
    </header>


    <!-- =========================
         INICIO DE SESIÓN
    ========================== -->

    <section
        id="login-admin"
        class="admin-contenedor"
    >

        <div class="admin-card">

            <h2>Ingresar al panel</h2>

            <label for="admin-email">
                Email
            </label>

            <input
                type="email"
                id="admin-email"
                placeholder="tu@email.com"
            >

            <label for="admin-password">
                Contraseña
            </label>

            <input
                type="password"
                id="admin-password"
                placeholder="Contraseña"
            >

            <button
                type="button"
                id="boton-login"
            >
                Ingresar
            </button>

            <p id="mensaje-login"></p>

        </div>

    </section>


    <main
    id="panel-admin"
    class="admin-contenedor"
    style="display: none;"
>

    <div class="admin-superior">

        <div>
            <h2>Administración</h2>

            <p>
                Modificá precios y disponibilidad de los
                productos de Dulce Maniak.
            </p>
        </div>

        <button
            type="button"
            id="boton-cerrar-sesion"
        >
            Cerrar sesión
        </button>

    </div>

<!-- =========================
     BUSCADOR Y FILTROS
========================= -->

<section class="admin-filtros">

    <div class="admin-buscador">

        <span>🔍</span>

        <input
            type="text"
            id="admin-buscador"
            placeholder="Buscar producto o porción..."
            autocomplete="off"
        >

    </div>


    <div class="admin-botones-filtro">

        <button
            type="button"
            class="admin-filtro-btn activo"
            data-filtro="todos"
        >
            Todos
        </button>

        <button
            type="button"
            class="admin-filtro-btn"
            data-filtro="producto"
        >
            Productos
        </button>

        <button
            type="button"
            class="admin-filtro-btn"
            data-filtro="porcion"
        >
            Porciones
        </button>

        <button
            type="button"
            class="admin-filtro-btn"
            data-filtro="disponible"
        >
            Disponibles
        </button>

        <button
            type="button"
            class="admin-filtro-btn"
            data-filtro="no-disponible"
        >
            No disponibles
        </button>

    </div>

</section>

    <div class="admin-secciones">

        <!-- PRODUCTOS -->
        <section class="admin-seccion productos-admin">

            <div class="admin-titulo-seccion">
                <h2>🍰 Productos</h2>
                <p>Precios y disponibilidad.</p>
            </div>

            <div id="lista-productos"></div>

        </section>


        <!-- PORCIONES -->
        <section class="admin-seccion porciones-admin">

            <div class="admin-titulo-seccion">
                <h2>🍰 Porciones</h2>
                <p>Activá o desactivá las porciones disponibles.</p>
            </div>

            <div id="lista-porciones"></div>

        </section>

    </div>


    <p id="mensaje-panel"></p>

</main>


    <script src="admin.js"></script>

</body>

</html>
